# Copy this file to .streamlit/secrets.toml and fill in the real values.
# Never commit .streamlit/secrets.toml. Without these secrets the app uses
# the local SQLite file data/game.db.
TURSO_DATABASE_URL = "libsql://your-database-name.turso.io"
TURSO_AUTH_TOKEN = "your-turso-auth-token"

# Google sign-in (st.login). Create an OAuth client in Google Cloud and fill in
# its values. redirect_uri is http://localhost:8501/oauth2callback on the laptop
# and https://<your-app-url>/oauth2callback on the deployed app.
# cookie_secret is a long random text, for example from:
#   python -c "import secrets; print(secrets.token_hex(32))"
[auth]
redirect_uri = "http://localhost:8501/oauth2callback"
cookie_secret = "a-long-random-secret"
client_id = "your-google-client-id.apps.googleusercontent.com"
client_secret = "your-google-client-secret"
server_metadata_url = "https://accounts.google.com/.well-known/openid-configuration"
